<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク - 就活管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<nav id="nav"></nav>
<div id="app">
<h1>タスク</h1>
<input type="text" id="taskTitle" placeholder="やること(例: ES提出)">
<label>期限 <input type="date" id="taskDue"></label>
<label>企業 <select id="taskCompany"></select></label>
<button id="taskBtn">追加</button>
<h2>タスク一覧</h2>
<label>表示する企業 <select id="filterCompany"></select></label>
<label class="toggle"><input type="checkbox" id="hideDone" checked> 完了したタスクを隠す</label>
<p id="note"></p>
<ul id="taskList"></ul>
</div>
<script type="module">
import { start, tasks, companies, saveTasks, dateString, companyName } from "./common.js";
let hideDone = true;
let filter = "all";
function opt(v, t) { const o = document.createElement("option"); o.value = v; o.textContent = t; return o; }
function companySelect(current, onchange) {
  const sel = document.createElement("select");
  sel.className = "co-select";
  sel.appendChild(opt("", "企業なし"));
  companies.forEach(function (c) { sel.appendChild(opt(c.id, c.name)); });
  sel.value = companyName(current) ? current : "";
  sel.onchange = function () { onchange(sel.value); };
  return sel;
}
function fillSelects() {
  const add = document.getElementById("taskCompany");
  const fil = document.getElementById("filterCompany");
  add.innerHTML = ""; fil.innerHTML = "";
  add.appendChild(opt("", "企業なし"));
  fil.appendChild(opt("all", "すべて")); fil.appendChild(opt("none", "企業なし"));
  companies.forEach(function (c) { add.appendChild(opt(c.id, c.name)); fil.appendChild(opt(c.id, c.name)); });
  fil.value = filter;
}
function matchFilter(t) {
  if (filter === "all") return true;
  if (filter === "none") return !companyName(t.companyId);
  return t.companyId === filter;
}
function renderTasks() {
  const ul = document.getElementById("taskList");
  ul.innerHTML = "";
  const base = tasks.filter(matchFilter);
  const doneCount = base.filter(function (t) { return t.done; }).length;
  document.getElementById("note").textContent =
    hideDone && doneCount > 0 ? "完了 " + doneCount + "件を非表示にしています" : "";
  const shown = base.filter(function (t) { return !(hideDone && t.done); });
  if (shown.length === 0) {
    ul.innerHTML = "<li>" + (tasks.length === 0 ? "タスクはありません" : "表示するタスクはありません") + "</li>";
    return;
  }
  shown.sort(function (a, b) {
    return (a.done - b.done) || ((a.due === "") - (b.due === "")) || a.due.localeCompare(b.due);
  });
  shown.forEach(function (t) {
    const li = document.createElement("li");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = t.done;
    cb.onchange = function () { t.done = cb.checked; saveTasks(); renderTasks(); };
    li.appendChild(cb);
    const span = document.createElement("span");
    span.textContent = (t.due ? "[" + t.due + "] " : "") + t.title + " ";
    if (t.done) span.style.textDecoration = "line-through";
    if (!t.done && t.due && t.due < dateString(0)) span.style.color = "red";
    li.appendChild(span);
    li.appendChild(companySelect(t.companyId, function (v) { t.companyId = v; saveTasks(); renderTasks(); }));
    li.appendChild(document.createTextNode(" "));
    const del = document.createElement("button");
    del.textContent = "削除";
    del.onclick = function () { tasks.splice(tasks.indexOf(t), 1); saveTasks(); renderTasks(); };
    li.appendChild(del);
    ul.appendChild(li);
  });
}
document.getElementById("hideDone").onchange = function (e) { hideDone = e.target.checked; renderTasks(); };
document.getElementById("filterCompany").onchange = function (e) { filter = e.target.value; renderTasks(); };
document.getElementById("taskBtn").onclick = function () {
  const titleInput = document.getElementById("taskTitle");
  const dueInput = document.getElementById("taskDue");
  const title = titleInput.value.trim();
  if (title === "") return;
  tasks.push({ title: title, due: dueInput.value, done: false, companyId: document.getElementById("taskCompany").value });
  saveTasks();
  titleInput.value = ""; dueInput.value = "";
  renderTasks();
};
start("tasks.html", function () { fillSelects(); renderTasks(); });
</script>
</body>
</html>
